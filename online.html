<!DOCTYPE html>
<html>
<head>
<title>C-C</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated;font-family:monospace}
body{background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column;gap:20px;padding:20px}
input{background:#000;border:2px solid #808080;color:#fff;padding:15px;width:280px;font-size:20px}
button{background:#000;border:2px solid #fff;color:#fff;padding:15px 30px;cursor:pointer;font-size:20px;width:280px}
button:hover{background:#fff;color:#000}
.board{display:grid;grid-template-columns:repeat(3,100px);gap:2px;background:#808080;border:2px solid #808080}
.cell{width:100px;height:100px;background:#000;display:flex;justify-content:center;align-items:center;font-size:40px;cursor:pointer}
.cell:hover{background:#808080}
#os,#gidD{font-size:24px}
</style>
</head>
<body>
<div id="om">
<button onclick="createGame()">СОЗДАТЬ</button>
<input id="gid" placeholder="АЙДИ ИГРЫ" maxlength="8">
<button onclick="joinGame()">ВОЙТИ</button>
</div>
<div id="og" style="display:none">
<div id="gidD"></div>
<div class="board" id="ob"></div>
<div id="os"></div>
</div>
<button onclick="location.href='index.html'">НАЗАД</button>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js"></script>
<script>
const fc={apiKey:"AIzaSyCkb5_RLx2ZKfsfx8Y4eJARNsTxyCgGSmg",authDomain:"crosses-circles.firebaseapp.com",databaseURL:"https://crosses-circles-default-rtdb.firebaseio.com",projectId:"crosses-circles",storageBucket:"crosses-circles.firebasestorage.app",messagingSenderId:"772946982730",appId:"1:772946982730:web:33720a21f3bbbd24c4b3b3"};
firebase.initializeApp(fc);
const db=firebase.database();
let ob=['','','','','','','','',''],oc='X',ogid='',op='',uid='';
const W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
firebase.auth().onAuthStateChanged(u=>{if(!u){location.href='index.html'}else{uid=u.uid}});
function render(){const b=document.getElementById('ob');b.innerHTML='';ob.forEach((c,i)=>{const d=document.createElement('div');d.className='cell';d.textContent=c;d.onclick=()=>omove(i);b.appendChild(d)});document.getElementById('os').textContent=oc+' ХОДИТ'}
function checkW(){return W.some(w=>ob[w[0]]&&ob[w[0]]===ob[w[1]]&&ob[w[0]]===ob[w[2]])}
function createGame(){ogid=Math.random().toString(36).substr(2,8).toUpperCase();op='X';ob=['','','','','','','','',''];db.ref('games/'+ogid).set({board:ob,current:'X',players:1,playerX:uid});db.ref('games/'+ogid+'/players').on('value',s=>{if(s.val()===2){om.style.display='none';og.style.display='block';gidD.textContent='АЙДИ: '+ogid;startL()}});om.style.display='none';og.style.display='block';gidD.textContent='АЙДИ: '+ogid}
function joinGame(){ogid=gid.value.toUpperCase();op='O';db.ref('games/'+ogid+'/players').transaction(v=>(v||0)+1);db.ref('games/'+ogid+'/playerO').set(uid);om.style.display='none';og.style.display='block';gidD.textContent='АЙДИ: '+ogid;startL()}
function startL(){db.ref('games/'+ogid+'/board').on('value',s=>{if(s.val()){ob=s.val();render()}});db.ref('games/'+ogid+'/current').on('value',s=>{if(s.val()){oc=s.val();render()}})}
function omove(i){if(ob[i]||oc!==op)return;ob[i]=op;db.ref('games/'+ogid+'/board').set(ob);if(checkW()){alert(op+' ПОБЕДИЛ');db.ref('games/'+ogid).remove();resetO()}else if(ob.every(c=>c)){alert('НИЧЬЯ');db.ref('games/'+ogid).remove();resetO()}else{db.ref('games/'+ogid+'/current').set(op==='X'?'O':'X')}render()}
function resetO(){ob=['','','','','','','','',''];oc='X';ogid='';op='';om.style.display='block';og.style.display='none';gid.value='';location.href='index.html'}
</script>
</body>
</html>
