<!DOCTYPE html>
<html>
<head>
<title>C-C</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated;font-family:monospace}
body{background:#000;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column;gap:20px;padding:20px}
input{background:#000;border:2px solid #808080;color:#fff;padding:15px;width:280px;font-size:20px}
button{background:#000;border:2px solid #fff;color:#fff;padding:15px 30px;cursor:pointer;font-size:20px;width:280px}
button:hover{background:#fff;color:#000}
.page{display:none}
.page.active{display:flex;flex-direction:column;align-items:center;gap:20px}
#passWrap{position:relative;width:280px}
#passWrap input{width:100%;padding-right:70px}
#eyeBtn{position:absolute;right:0;top:0;height:100%;width:70px;background:#000;border:2px solid #808080;color:#fff;cursor:pointer;font-size:16px;padding:0}
#eyeBtn:hover{background:#808080;color:#000}
</style>
</head>
<body>
<div id="auth" class="page active">
<input id="nickname" placeholder="НИКНЕЙМ">
<div id="passWrap">
<input id="password" placeholder="ПАРОЛЬ" type="password">
<button id="eyeBtn" onclick="togglePass()">ВИДНО</button>
</div>
<button onclick="signUp()">РЕГИСТРАЦИЯ</button>
<button onclick="signIn()">ВОЙТИ</button>
</div>
<div id="menu" class="page">
<div id="userInfo" style="font-size:24px"></div>
<button onclick="location.href='local.html'">2 ИГРОКА</button>
<button onclick="location.href='online.html'">ОНЛАЙН</button>
<button onclick="signOut()">ВЫХОД</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

const fc={apiKey:"AIzaSyCkb5_RLx2ZKfsfx8Y4eJARNsTxyCgGSmg",authDomain:"crosses-circles.firebaseapp.com",databaseURL:"https://crosses-circles-default-rtdb.firebaseio.com",projectId:"crosses-circles",storageBucket:"crosses-circles.firebasestorage.app",messagingSenderId:"772946982730",appId:"1:772946982730:web:33720a21f3bbbd24c4b3b3"};
const app=initializeApp(fc);
const auth=getAuth(app);
const db=getDatabase(app);

function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}

onAuthStateChanged(auth,u=>{
if(u){
showPage('menu');
document.getElementById('userInfo').textContent=u.email.split('@')[0];
}else{
showPage('auth');
}
});

window.togglePass=function(){
const p=document.getElementById('password');
const b=document.getElementById('eyeBtn');
if(p.type==='password'){p.type='text';b.textContent='СКРЫТЬ'}else{p.type='password';b.textContent='ВИДНО'}
};

window.signUp=function(){
const nick=document.getElementById('nickname').value;
const pass=document.getElementById('password').value;
if(!nick||!pass){alert('ЗАПОЛНИ ВСЕ ПОЛЯ');return}
createUserWithEmailAndPassword(auth,nick+'@c-c.com',pass).then(cred=>{
set(ref(db,'users/'+cred.user.uid),{nickname:nick});
}).catch(e=>alert(e.message));
};

window.signIn=function(){
const nick=document.getElementById('nickname').value;
const pass=document.getElementById('password').value;
if(!nick||!pass){alert('ЗАПОЛНИ ВСЕ ПОЛЯ');return}
signInWithEmailAndPassword(auth,nick+'@c-c.com',pass).catch(e=>alert(e.message));
};

window.signOut=function(){
signOut(auth);
};
</script>
</body>
</html>
